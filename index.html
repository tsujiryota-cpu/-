<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>身内ネタ性格診断【MBTI風・科学的根拠0人】</title>
<style>
  :root {
    --bg: #1a1333;
    --card: #241b47;
    --accent: #ff5c8a;
    --accent2: #ffd166;
    --accent3: #4cc9f0;
    --text: #f5f0ff;
    --muted: #b3a8d9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,92,138,.15), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(76,201,240,.12), transparent 40%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 64px;
  }
  .app { width: 100%; max-width: 560px; }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,.35);
  }
  h1 {
    font-size: 1.5rem;
    line-height: 1.4;
    text-align: center;
    margin-bottom: 8px;
  }
  .subtitle { text-align: center; color: var(--muted); font-size: .85rem; margin-bottom: 20px; line-height: 1.7; }
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    margin-top: 12px;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    background: #342a5e;
    color: var(--text);
    text-align: left;
    transition: transform .1s, background .15s;
    line-height: 1.5;
  }
  .btn:hover, .btn:active { transform: scale(.98); background: #453879; }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), #c94cf0);
    text-align: center;
    font-size: 1.1rem;
  }
  .cast-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    margin-bottom: 20px;
  }
  .cast-grid svg { width: 100%; height: auto; border-radius: 10px; display: block; }
  .progress-wrap { height: 8px; background: #342a5e; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .3s; }
  .q-count { color: var(--muted); font-size: .8rem; margin-bottom: 8px; }
  .q-text { font-size: 1.15rem; font-weight: bold; line-height: 1.6; margin-bottom: 20px; min-height: 3.2em; }
  .hidden { display: none; }

  /* 結果画面 */
  .portrait {
    width: 160px; height: 160px;
    margin: 0 auto 16px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,.4);
  }
  .portrait svg { width: 100%; height: 100%; display: block; }
  .result-code {
    text-align: center;
    font-size: 2.2rem;
    font-weight: 900;
    letter-spacing: .12em;
    background: linear-gradient(90deg, var(--accent2), var(--accent), var(--accent3));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 2px;
  }
  .result-name { text-align: center; font-size: 1.45rem; font-weight: bold; margin-bottom: 4px; }
  .result-tagline { text-align: center; color: var(--muted); font-size: .9rem; margin-bottom: 20px; }
  .section { margin-top: 20px; }
  .section h3 {
    font-size: .8rem;
    color: var(--accent2);
    letter-spacing: .15em;
    margin-bottom: 8px;
  }
  .section p { font-size: .95rem; line-height: 1.8; }
  .neta-box {
    background: #1d1640;
    border-left: 3px solid var(--accent3);
    border-radius: 0 10px 10px 0;
    padding: 12px 14px;
    font-size: .85rem;
    line-height: 1.7;
    color: var(--muted);
  }
  .axis { margin-top: 14px; }
  .axis-labels { display: flex; justify-content: space-between; font-size: .78rem; margin-bottom: 4px; gap: 8px; }
  .axis-labels .win { font-weight: bold; color: var(--accent2); }
  .axis-bar { height: 10px; background: #342a5e; border-radius: 5px; overflow: hidden; }
  .axis-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent3)); border-radius: 5px; transition: width .8s ease-out; }
  .compat { display: flex; gap: 12px; margin-top: 8px; }
  .compat > div {
    flex: 1;
    background: #342a5e;
    border-radius: 12px;
    padding: 12px;
    font-size: .85rem;
    line-height: 1.6;
  }
  .compat .label { font-size: .7rem; color: var(--muted); display: block; margin-bottom: 4px; }
  .footer-note { text-align: center; color: var(--muted); font-size: .75rem; margin-top: 24px; line-height: 1.8; }
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent);
    color: #fff;
    padding: 10px 24px;
    border-radius: 999px;
    font-size: .9rem;
    font-weight: bold;
    transition: transform .3s;
    z-index: 10;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>

let current = 0;

const shuffled = [...QUESTIONS].sort(() => Math.random() - 0.5);

// スタート画面に16タイプの顔見せグリッド
const castBox = document.getElementById("cast");
Object.keys(TYPES).forEach(code => {
  castBox.innerHTML += `<svg viewBox="0 0 100 100" role="img" aria-label="${TYPES[code].name}"><use href="#pt-${code}"/></svg>`;
});

function startQuiz() {
  document.getElementById("screen-start").classList.add("hidden");
  document.getElementById("screen-quiz").classList.remove("hidden");
  showQuestion();
}

function showQuestion() {
  const q = shuffled[current];
  document.getElementById("progress").style.width = (current / shuffled.length * 100) + "%";
  document.getElementById("qcount").textContent = `Q${current + 1} / ${shuffled.length}`;
  document.getElementById("qtext").textContent = q.text;
  const box = document.getElementById("answers");
  box.innerHTML = "";
  q.choices.forEach(([text, score]) => {
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = text;
    b.onclick = () => answer(q.axis, score);
    box.appendChild(b);
  });
}

function answer(axis, score) {
  scores[axis] += score;
  current++;
  if (current < shuffled.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("screen-quiz").classList.add("hidden");
  document.getElementById("screen-result").classList.remove("hidden");

  const code = AXES.map((a, i) => scores[i] >= 0 ? a.hi : a.lo).join("");
  const t = TYPES[code];

  document.getElementById("ruse").setAttribute("href", "#pt-" + code);
  document.getElementById("rcode").textContent = code;
  document.getElementById("rname").textContent = t.name;
  document.getElementById("rtagline").textContent = t.tagline;
  document.getElementById("rdesc").textContent = t.desc;
  document.getElementById("rmanual").textContent = t.manual;
  document.getElementById("rneta").textContent = t.neta;
  document.getElementById("rbest").textContent = `${TYPES[t.best].name}(${t.best})`;
  document.getElementById("rworst").textContent = `${TYPES[t.worst].name}(${t.worst})`;

  const axesBox = document.getElementById("raxes");
  axesBox.innerHTML = "";
  AXES.forEach((a, i) => {
    // 各軸は質問3問 × ±1 = -3〜+3。+側の割合に変換
    const pct = Math.round((scores[i] + 3) / 6 * 100);
    const hiWin = scores[i] >= 0;
    const div = document.createElement("div");
    div.className = "axis";
    div.innerHTML = `
      <div class="axis-labels">
        <span class="${hiWin ? "win" : ""}">${a.hiLabel} ${pct}%</span>
        <span class="${hiWin ? "" : "win"}">${100 - pct}% ${a.loLabel}</span>
      </div>
      <div class="axis-bar"><div class="axis-fill" style="width:0%"></div></div>`;
    axesBox.appendChild(div);
    requestAnimationFrame(() => {
      div.querySelector(".axis-fill").style.width = pct + "%";
    });
  });

  window._resultText =
    `【身内ネタ性格診断】\n` +
    `私は「${code}:${t.name}」でした🧠\n` +
    `→ ${t.tagline}\n` +
    `💖相性◎: ${TYPES[t.best].name} / 💀相性✕: ${TYPES[t.worst].name}\n` +
    `文句を言うならお前もやれ`;
}

function copyResult() {
  navigator.clipboard.writeText(window._resultText).then(() => {
    const toast = document.getElementById("toast");
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2000);
  }).catch(() => {
    prompt("コピーできなかったので手動でどうぞ:", window._resultText);
  });
}
</script>
</body>
</html>
