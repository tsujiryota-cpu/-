<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サンデーズ オーダー表</title>
<meta name="description" content="草野球のオーダー(打順・守備位置)とメンバー紹介を写真つきで共有するページ。ブラウザ上で編集できます。">
<meta property="og:title" content="⚾ サンデーズ オーダー表">
<meta property="og:description" content="打順・守備位置・メンバー紹介を写真つきで。集合時間と持ち物もここで確認。">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style id="css">
/* ============================================================
   トークン(ライト = 昼のグラウンド)
   ============================================================ */
:root{
  --paper:#EFEDE3; --panel:#FBFAF4;
  --ink:#161B16; --ink-2:#4C5449; --ink-3:#7D8478;
  --rule:rgba(22,27,22,.14); --rule-strong:rgba(22,27,22,.26);
  --red:#BE3A2B; --turf:#2E5E3E; --dirt:#A97C50;
  --header-bg:#1E3D28; --header-ink:#F1EFE3; --header-ink-2:#A8C0A6;
  --chip:rgba(22,27,22,.06);
  --shadow:0 1px 0 rgba(22,27,22,.06), 0 8px 24px -18px rgba(22,27,22,.5);
  --flash:rgba(190,58,43,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F120E; --panel:#181D17;
    --ink:#EBE8DD; --ink-2:#A9B0A2; --ink-3:#7C8479;
    --rule:rgba(235,232,221,.16); --rule-strong:rgba(235,232,221,.3);
    --red:#FF6B54; --turf:#8CC07A; --dirt:#C79A6B;
    --header-bg:#14201A; --header-ink:#EBE8DD; --header-ink-2:#93A98F;
    --chip:rgba(235,232,221,.08);
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 30px -20px #000;
    --flash:rgba(255,107,84,.2);
  }
}
:root[data-theme="dark"]{
  --paper:#0F120E; --panel:#181D17;
  --ink:#EBE8DD; --ink-2:#A9B0A2; --ink-3:#7C8479;
  --rule:rgba(235,232,221,.16); --rule-strong:rgba(235,232,221,.3);
  --red:#FF6B54; --turf:#8CC07A; --dirt:#C79A6B;
  --header-bg:#14201A; --header-ink:#EBE8DD; --header-ink-2:#93A98F;
  --chip:rgba(235,232,221,.08);
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 30px -20px #000;
  --flash:rgba(255,107,84,.2);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased;
}
.num{font-family:"Saira Condensed","Arial Narrow",Impact,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:4px}
button{font:inherit;color:inherit}

/* ---------- ヘッダー ---------- */
.hero{background:var(--header-bg);color:var(--header-ink);position:relative;overflow:hidden}
.hero__diamond{position:absolute;right:-40px;top:-20px;width:340px;height:340px;opacity:.16;pointer-events:none}
.hero__inner{position:relative;padding-top:34px;padding-bottom:30px}  /* .wrap の左右余白を消さないよう上下だけ指定 */
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.18em;color:var(--header-ink-2)}
.hero__team{font-weight:900;font-size:clamp(2.1rem,7vw,3.4rem);line-height:1.08;letter-spacing:-.01em;margin:.28em 0 .1em;text-wrap:balance}
.hero__vs{display:flex;align-items:baseline;gap:.55em;flex-wrap:wrap;font-size:clamp(1rem,3.4vw,1.25rem);font-weight:700}
.hero__vs .vs{font-family:"Saira Condensed",sans-serif;font-weight:900;font-size:1.5em;color:var(--header-ink-2);letter-spacing:.02em}
.hero__ground{margin-top:.5em;color:var(--header-ink-2);font-size:.95rem;font-weight:500}
.hero__tools{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
@media (max-width:600px){.hero__diamond{width:230px;right:-56px;top:-8px;opacity:.12}}
.btn{
  font-size:.85rem;font-weight:700;cursor:pointer;background:transparent;color:var(--header-ink);
  border:1.5px solid rgba(241,239,227,.38);border-radius:999px;padding:.45em 1.1em;
  display:inline-flex;align-items:center;gap:.45em;transition:background .18s ease,border-color .18s ease,transform .18s ease;
}
.btn:hover{background:rgba(241,239,227,.12);border-color:rgba(241,239,227,.7)}
.btn:active{transform:translateY(1px)}
.btn--primary{background:var(--header-ink);color:var(--header-bg);border-color:var(--header-ink)}
.btn--primary:hover{background:#fff;border-color:#fff}

/* ---------- 試合情報 ---------- */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--rule);background:var(--panel)}
.fact{padding:14px 18px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.fact:last-child{border-right:none}
.fact dt{font-size:.7rem;font-weight:700;letter-spacing:.14em;color:var(--ink-3)}
.fact dd{font-size:1.02rem;font-weight:700;margin-top:.15em}
.fact dd small{font-weight:500;color:var(--ink-2);font-size:.82rem}

/* ---------- セクション ---------- */
section{margin-top:44px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.sec-head h2{font-size:1.3rem;font-weight:900;line-height:1.3}
.sec-head p{font-size:.8rem;color:var(--ink-2);font-weight:500}

/* ---------- オーダー表 ---------- */
.order{margin-top:16px;background:var(--panel);border:1px solid var(--rule-strong);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.order__row{
  display:grid;grid-template-columns:52px 40px minmax(0,1fr) auto;align-items:center;gap:12px;
  width:100%;text-align:left;background:transparent;border:0;cursor:pointer;
  padding:11px 14px;border-bottom:1px solid var(--rule);transition:background .16s ease;
}
.order__row:last-child{border-bottom:0}
.order__row:hover{background:var(--chip)}
.order__no{font-family:"Saira Condensed",sans-serif;font-variant-numeric:tabular-nums;font-size:2rem;font-weight:900;color:var(--red);text-align:center;line-height:1}
.order__no small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:.34em;color:var(--ink-3);letter-spacing:.1em;line-height:1.2}
.pos{width:40px;height:40px;border-radius:5px;display:grid;place-items:center;font-weight:900;font-size:1.05rem;color:#FBFAF4;background:var(--turf)}
.pos[data-g="battery"]{background:var(--red)}
.pos[data-g="outfield"]{background:var(--dirt)}
.pos[data-g="dh"]{background:var(--ink-3)}
.order__name{font-weight:700;font-size:1.08rem;display:flex;align-items:baseline;gap:.5em;flex-wrap:wrap}
.order__name .badge{font-size:.66rem;font-weight:700;letter-spacing:.08em;color:var(--red);border:1px solid currentColor;border-radius:3px;padding:.05em .35em}
.order__note{font-size:.82rem;color:var(--ink-2);font-weight:500;line-height:1.5;white-space:pre-line}
.order__meta{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:.8rem;font-weight:700;white-space:nowrap}
.order__meta .jersey{font-family:"Saira Condensed",sans-serif;font-variant-numeric:tabular-nums;font-size:1.35rem;font-weight:900;color:var(--ink);line-height:1}
.bat{border:1px solid var(--rule-strong);border-radius:3px;padding:.1em .4em;font-size:.72rem}

/* 控え */
.bench{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.bench__item{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:.35em .9em .35em .55em;font-size:.88rem;font-weight:700;cursor:pointer}
.bench__item:hover{border-color:var(--rule-strong)}
.bench__item .jersey{font-family:"Saira Condensed",sans-serif;font-weight:900;font-size:1.15rem;color:var(--red);font-variant-numeric:tabular-nums}
.bench__item small{font-weight:500;color:var(--ink-2)}
.bench__empty{font-size:.85rem;color:var(--ink-3);margin-top:12px}

/* ---------- メンバー紹介 ---------- */
.members{display:grid;gap:14px;margin-top:18px;grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
@media (max-width:900px){.members{grid-template-columns:1fr}}
.card{position:relative;display:grid;grid-template-columns:124px minmax(0,1fr);gap:14px;background:var(--panel);border:1px solid var(--rule-strong);border-radius:8px;padding:14px;box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:20px}
.card__jersey{position:absolute;right:10px;top:2px;font-family:"Saira Condensed",sans-serif;font-weight:900;font-size:3.6rem;line-height:1;color:var(--ink);opacity:.09;font-variant-numeric:tabular-nums;pointer-events:none}
.photo{position:relative;aspect-ratio:4/5;border-radius:5px;overflow:hidden;background:var(--chip);border:1px solid var(--rule)}
.photo img{width:100%;height:100%;object-fit:contain;display:block}  /* トレカ画像などが切れないよう全体を収める */
.photo__fallback{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:2px;font-family:"Saira Condensed",sans-serif;font-weight:900;font-size:2rem;color:var(--ink-3);background:repeating-linear-gradient(135deg,var(--chip) 0 8px,transparent 8px 16px)}
.photo__fallback span{font-family:"Zen Kaku Gothic New",sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.06em}
.card__body{min-width:0;padding-right:52px}
.card__kana{font-size:.7rem;letter-spacing:.1em;color:var(--ink-3);font-weight:700}
.card__name{font-size:1.22rem;font-weight:900;line-height:1.25;margin-top:-.1em}
.card__role{font-size:.8rem;font-weight:700;color:var(--turf);margin-top:.2em}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:.55em 0}
.tag{font-size:.72rem;font-weight:700;background:var(--chip);border-radius:3px;padding:.15em .5em;color:var(--ink-2)}
.card__intro{font-size:.9rem;color:var(--ink-2);line-height:1.72;white-space:pre-line}  /* 入力した改行をそのまま表示 */
.card--flash{animation:flash 1.1s ease-out}
@keyframes flash{0%,40%{background:var(--flash)}100%{background:var(--panel)}}
@media (max-width:600px){.card{grid-template-columns:104px minmax(0,1fr);gap:12px}.card__body{padding-right:26px}.card__jersey{font-size:2.6rem;right:8px}}  /* 狭い画面では本文を広げてタグの折り返しを減らす */

/* ---------- パワプロ風オーダーパネル ---------- */
:root{ --good-fg:#1B5FA8; --good-bd:#7FA9DC; --bad-fg:#A8352A; --bad-bd:#DE9A92; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --good-fg:#8CC6FF; --good-bd:#3C7FD0; --bad-fg:#FF9C8B; --bad-bd:#C0453A; }
}
:root[data-theme="dark"]{ --good-fg:#8CC6FF; --good-bd:#3C7FD0; --bad-fg:#FF9C8B; --bad-bd:#C0453A; }

/* パネル本体（ライト/ダーク共通で「ゲーム画面」として濃色） */
.order{
  background:linear-gradient(180deg,#1E3055 0%,#111E3B 100%);
  border:2px solid #3E5F96;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 14px 30px -22px rgba(0,0,0,.8);
  color:#EDF2FA;
}
.order__head{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:7px 14px;background:linear-gradient(180deg,#2B4675,#1A2C54);
  border-bottom:2px solid #3E5F96;
  font-family:"Saira Condensed",sans-serif;font-weight:900;font-size:1rem;letter-spacing:.14em;color:#F7CE55;
}
.order__head span{
  font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:.66rem;
  letter-spacing:.04em;color:#9FB6D9;
}
.order .order__row{border-bottom:1px solid rgba(255,255,255,.12)}
.order .order__row:nth-of-type(even){background:rgba(255,255,255,.045)}
.order .order__row:hover{background:rgba(247,206,85,.14)}
.order .order__no{color:#F7CE55;text-shadow:0 2px 0 rgba(0,0,0,.55)}
.order .order__no small{color:#9FB6D9}
.order .pos{border:1.5px solid rgba(255,255,255,.55);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.order .order__name{color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.order .order__name .badge{color:#F7CE55}
.order .order__note{color:#A9C0E0}
.order .order__meta{color:#A9C0E0}
.order .order__meta .jersey{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.order .bat{border-color:rgba(255,255,255,.45);color:#D6E2F4}
.order .rank{color:#9FB6D9}
.order .skill--good{color:#8CC6FF;border-color:#3C7FD0;background:rgba(60,127,208,.2)}
.order .skill--bad{color:#FF9C8B;border-color:#C0453A;background:rgba(192,69,58,.2)}
.order .traj{color:#9FB6D9}

/* 能力ランク */
.ranks{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.rank{display:inline-flex;align-items:center;gap:2px;font-size:.62rem;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
.rank b{
  font-family:"Saira Condensed",sans-serif;font-size:.95rem;font-weight:900;line-height:1.15;
  min-width:1.35em;text-align:center;padding:0 .18em;border-radius:3px;
  color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.45);
}
.rank b[data-r="S"]{background:#FF3B30;box-shadow:0 0 0 1.5px #F7CE55}
.rank b[data-r="A"]{background:#EE3B2B}
.rank b[data-r="B"]{background:#F0821C}
.rank b[data-r="C"]{background:#F2C230;color:#2A2410;text-shadow:none}
.rank b[data-r="D"]{background:#3AA249}
.rank b[data-r="E"]{background:#2E7DD1}
.rank b[data-r="F"]{background:#8A5CD6}
.rank b[data-r="G"]{background:#7C8698}
.traj{display:inline-flex;align-items:center;gap:3px;font-size:.62rem;font-weight:700;color:var(--ink-3)}
.traj b{font-family:"Saira Condensed",sans-serif;font-size:.95rem;font-weight:900;color:var(--ink)}
.order .traj b{color:#fff}

/* 特殊能力（青特・赤特） */
.skills{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.skill{font-size:.66rem;font-weight:700;border-radius:3px;padding:.05em .45em;border:1.5px solid;line-height:1.6}
.skill--good{color:var(--good-fg);border-color:var(--good-bd);background:rgba(46,125,209,.1)}
.skill--bad{color:var(--bad-fg);border-color:var(--bad-bd);background:rgba(190,58,43,.1)}

/* メンバーカードの能力欄 */
.abil{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:.5em}
.abil .ranks{margin-top:0}

/* 編集画面の能力入力 */
/* 狭い画面では能力ランクを1行に収める */
@media (max-width:600px){
  .order .order__row{grid-template-columns:44px 36px minmax(0,1fr) auto;gap:9px;padding:10px 10px}
  .order .ranks{gap:3px}
  .order .rank{font-size:.55rem;gap:1px}
  .order .rank b{font-size:.82rem;min-width:1.2em;padding:0 .1em}
  .order .pos{width:36px;height:36px;font-size:.98rem}
  .order .order__meta{gap:6px}
  .order .skill{font-size:.62rem;padding:.05em .35em}
}

.ed-sub{font-size:.7rem;font-weight:700;letter-spacing:.1em;color:var(--ink-3);margin-top:2px}
.ed-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px}

/* ---------- 連絡事項 ---------- */
.notes{margin-top:16px;background:var(--panel);border:1px solid var(--rule-strong);border-radius:8px;padding:6px 18px}
.notes li{list-style:none;padding:11px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:baseline}
.notes li:last-child{border-bottom:0}
.notes b{font-size:.74rem;letter-spacing:.1em;color:var(--ink-3)}
.notes span{font-size:.94rem;font-weight:500;white-space:pre-line}
@media (max-width:520px){.notes li{grid-template-columns:1fr;gap:2px}}

footer{margin:52px 0 40px;padding-top:18px;border-top:1px solid var(--rule);font-size:.8rem;color:var(--ink-3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- トースト ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:var(--ink);color:var(--paper);font-size:.85rem;font-weight:700;padding:.6em 1.2em;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;z-index:60;max-width:88vw;text-align:center;line-height:1.5}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 編集画面 ---------- */
.editor{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;overscroll-behavior:contain}
.editor[hidden]{display:none}
.editor__bar{position:sticky;top:0;z-index:3;background:var(--header-bg);color:var(--header-ink);box-shadow:0 6px 20px -14px rgba(0,0,0,.6)}
.editor__bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.editor__title{font-weight:900;font-size:1.05rem;display:flex;align-items:baseline;gap:.6em;flex-wrap:wrap}
.editor__title small{font-weight:500;font-size:.72rem;color:var(--header-ink-2);letter-spacing:.02em}
.editor__actions{display:flex;gap:8px;flex-wrap:wrap}
.editor__body{padding-bottom:64px}
.ed-sec{margin-top:32px}
.ed-sec > h3{font-size:1.05rem;font-weight:900;border-bottom:2px solid var(--ink);padding-bottom:6px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ed-sec > h3 span{font-size:.74rem;font-weight:500;color:var(--ink-2)}
.ed-grid{display:grid;gap:10px;margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ed-list{display:grid;gap:10px;margin-top:14px}
.field{display:grid;gap:3px}
.field > label{font-size:.7rem;font-weight:700;letter-spacing:.1em;color:var(--ink-3)}
input,select,textarea{
  font:inherit;font-size:.92rem;color:var(--ink);background:var(--panel);
  border:1px solid var(--rule-strong);border-radius:5px;padding:.5em .6em;width:100%;
}
textarea{resize:vertical;line-height:1.7}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:1px}
.ed-row{background:var(--panel);border:1px solid var(--rule-strong);border-radius:8px;padding:12px;display:grid;gap:10px}
.ed-row__head{display:flex;align-items:center;gap:8px;justify-content:space-between}
.ed-row__no{font-family:"Saira Condensed",sans-serif;font-weight:900;font-size:1.5rem;color:var(--red);line-height:1;min-width:2ch;font-variant-numeric:tabular-nums}
.ed-row__tools{display:flex;gap:6px}
.icon-btn{width:32px;height:32px;border-radius:5px;border:1px solid var(--rule-strong);background:transparent;cursor:pointer;font-size:.85rem;font-weight:700;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--chip);color:var(--ink)}
.icon-btn--danger:hover{border-color:var(--red);color:var(--red)}
.ed-row__cols{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (max-width:600px){.ed-row__cols{grid-template-columns:1fr}}
.ed-member{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px}
@media (max-width:600px){.ed-member{grid-template-columns:80px minmax(0,1fr)}}
.ed-photo{display:grid;gap:6px;align-content:start}
.ed-photo .photo{width:100%}
.ed-photo__btns{display:grid;gap:4px}
.btn-s{font-size:.72rem;font-weight:700;padding:.4em .5em;border:1px solid var(--rule-strong);border-radius:5px;background:transparent;cursor:pointer;text-align:center}
.btn-s:hover{background:var(--chip)}
.btn-s--danger:hover{border-color:var(--red);color:var(--red)}
.add-btn{margin-top:12px;width:100%;padding:.7em;border:1.5px dashed var(--rule-strong);border-radius:8px;background:transparent;cursor:pointer;font-weight:700;font-size:.88rem;color:var(--ink-2)}
.add-btn:hover{border-color:var(--red);color:var(--red)}
.ed-hint{font-size:.8rem;color:var(--ink-2);background:var(--chip);border-radius:6px;padding:10px 12px;margin-top:14px;line-height:1.7}
.ed-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:34px;padding-top:18px;border-top:1px solid var(--rule)}

<script id="app">
"use strict";
/* ===========================================================================
   草野球オーダー表 — 画面上のフォームだけで編集できるページ
   データは同じファイル内の <script id="team-data"> に入っています。
   「編集」→ 保存 で、共有URLのページ自体が新しい内容に置き換わります。
   =========================================================================== */

const POS_LIST = ["投","捕","一","二","三","遊","左","中","右","指"];
const POS_GROUP = {"投":"battery","捕":"battery","一":"infield","二":"infield","三":"infield","遊":"infield","左":"outfield","中":"outfield","右":"outfield","指":"dh"};
const BAT_LIST = ["右","左","両"];
/* パワプロ風の能力ランク */
const STATS = [
  { k:"meet",  label:"ミート",  short:"ミ" },
  { k:"power", label:"パワー",  short:"パ" },
  { k:"speed", label:"走力",    short:"走" },
  { k:"arm",   label:"肩力",    short:"肩" },
  { k:"field", label:"守備力",  short:"守" },
  { k:"catch", label:"捕球",    short:"捕" }
];
const ORDER_STATS = ["meet","power","speed","arm","field"];
const RANKS = ["","S","A","B","C","D","E","F","G"];
const TRAJ = ["","1","2","3","4"];
const FONT_LINK = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">';
const LS_KEY = "yakyu-order-sheet";

/* ---------- 小道具 ---------- */
const el = (tag, cls) => { const n = document.createElement(tag); if(cls) n.className = cls; return n; };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const todayLabel = () => {
  const d = new Date();
  const p = (n) => String(n).padStart(2,"0");
  return d.getFullYear() + "." + p(d.getMonth()+1) + "." + p(d.getDate());
};

/* ---------- データの読み込み ---------- */
function readEmbedded(){
  try{ return JSON.parse(document.getElementById("team-data").textContent); }
  catch(e){ console.error("データを読めませんでした", e); return null; }
}
/* このファイルに埋め込まれているデータの世代印 */
function embeddedStamp(){
  const e = readEmbedded() || {};
  return String(e.savedAt || e.updatedAt || "");
}
function loadData(){
  const base = readEmbedded() || { team:"チーム名", tagline:"", game:{}, roster:[], lineup:[], notes:[], updatedAt:"" };
  try{
    const saved = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    /* 端末に残した下書きは、埋め込みデータが同じ世代のときだけ使う
       （公開版が新しくなったら下書きは捨てる） */
    if(saved && saved.base === embeddedStamp() && saved.data) return saved.data;
  }catch(e){ /* localStorage が使えない環境は無視 */ }
  return base;
}
let DATA = loadData();
let DRAFT = null;
let capArtifact = null;   /* Artifact として公開されている場合の保存先 */
let capDownloads = null;

const byId = (id) => DATA.roster.find(m => m.id === id) || null;
const nameOf = (id) => { const m = byId(id); return m ? m.name : "（未選択）"; };

/* ===========================================================================
   表示
   =========================================================================== */
function render(){
  const g = DATA.game || {};
  const root = document.getElementById("root");
  root.textContent = "";
  document.title = (DATA.team || "オーダー表") + " オーダー表";

  /* ---- ヘッダー ---- */
  const hero = el("header","hero");
  hero.innerHTML =
    '<svg class="hero__diamond" viewBox="0 0 200 200" aria-hidden="true" fill="none" stroke="#F1EFE3" stroke-width="2">' +
      '<path d="M100 172 L28 100 L100 28 L172 100 Z"/><path d="M100 172 L100 100"/><path d="M28 100 L172 100"/>' +
      '<circle cx="100" cy="100" r="16"/><path d="M100 172 L44 44" stroke-dasharray="4 6"/></svg>' +
    '<div class="wrap hero__inner">' +
      '<p class="eyebrow">' + esc([g.dateLabel, g.playball ? "PLAY BALL " + g.playball : "", DATA.tagline].filter(Boolean).join(" · ")) + '</p>' +
      '<h1 class="hero__team">' + esc(DATA.team) + '</h1>' +
      (g.opponent ? '<p class="hero__vs"><span class="vs">VS</span>' + esc(g.opponent) + '</p>' : '') +
      (g.ground ? '<p class="hero__ground">📍 ' + esc(g.ground) + '</p>' : '') +
      '<div class="hero__tools no-print">' +
        '<button class="btn btn--primary" id="edit-btn" type="button">✏️ 編集する</button>' +
        '<button class="btn" id="copy-btn" type="button">🔗 URLをコピー</button>' +
        '<button class="btn" id="print-btn" type="button">🖨 印刷</button>' +
      '</div>' +
    '</div>';
  root.appendChild(hero);

  /* ---- 試合情報 ---- */
  const facts = el("dl","facts");
  [["集合", g.gather, g.playball ? "プレイボール " + g.playball : ""],
   ["対戦相手", g.opponent, ""],
   ["試合形式", g.format, ""],
   ["服装", g.uniform, g.weather]].forEach(([k,v,sub]) => {
    if(!v) return;
    const d = el("div","fact");
    d.innerHTML = "<dt>" + esc(k) + "</dt><dd>" + esc(v) + (sub ? " <small>" + esc(sub) + "</small>" : "") + "</dd>";
    facts.appendChild(d);
  });
  if(facts.children.length) root.appendChild(facts);

  const main = el("main","wrap");
  root.appendChild(main);

  /* ---- スタメン ---- */
  const s1 = el("section");
  s1.innerHTML = '<div class="sec-head"><h2>スタメン</h2><p>名前をタップすると紹介にジャンプ</p></div>';
  const order = el("div","order");
  const ohead = el("div","order__head");
  ohead.innerHTML = 'STARTING LINEUP<span>ミ ミート ／ パ パワー ／ 走 走力 ／ 肩 肩力 ／ 守 守備力</span>';
  order.appendChild(ohead);
  DATA.lineup.forEach((p, i) => {
    const m = byId(p.id) || {};
    const row = el("button","order__row reveal");
    row.type = "button";
    row.style.animationDelay = (i * 45) + "ms";
    row.setAttribute("aria-label", (i+1) + "番 " + (p.pos||"") + " " + (m.name||"") + " の紹介を見る");
    row.innerHTML =
      '<div class="order__no">' + (i+1) + '<small>番</small></div>' +
      '<div class="pos" data-g="' + (POS_GROUP[p.pos] || "infield") + '">' + esc(p.pos || "―") + '</div>' +
      '<div><div class="order__name">' + esc(m.name || "（未選択）") +
        (p.badge ? '<span class="badge">' + esc(p.badge) + '</span>' : '') + '</div>' +
        (p.note ? '<div class="order__note">' + esc(p.note) + '</div>' : '') +
        rankHtml(m, ORDER_STATS) + skillHtml(m) + '</div>' +
      '<div class="order__meta">' +
        (m.no ? '<span class="jersey">' + esc(m.no) + '</span>' : '') +
        (m.bat ? '<span class="bat">打' + esc(m.bat) + '</span>' : '') + '</div>';
    row.addEventListener("click", () => jumpTo(p.id));
    order.appendChild(row);
  });
  s1.appendChild(order);

  const usedIds = DATA.lineup.map(p => p.id);
  const benchList = DATA.roster.filter(m => usedIds.indexOf(m.id) === -1);
  if(benchList.length){
    const bench = el("div","bench");
    benchList.forEach(m => {
      const b = el("button","bench__item");
      b.type = "button";

function photoBox(m){

/* ---------- パワプロ風パーツ ---------- */
function rankHtml(m, keys){
  const st = m.stats || {};
  const items = keys.map(k => {
    const def = STATS.find(x => x.k === k);
    const v = st[k];
    if(!def || !v) return "";
    return '<span class="rank" title="' + esc(def.label) + '">' + esc(def.short) +
           '<b data-r="' + esc(v) + '">' + esc(v) + '</b></span>';
  }).filter(Boolean);
  return items.length ? '<div class="ranks">' + items.join("") + '</div>' : "";
}
function trajHtml(m){
  const t = (m.stats || {}).traj;
  return t ? '<span class="traj">弾道<b>' + esc(t) + '</b></span>' : "";
}
function skillHtml(m){
  const sk = m.skills || {};
  const chips = (sk.good || []).map(x => '<span class="skill skill--good">' + esc(x) + '</span>')
        .concat((sk.bad || []).map(x => '<span class="skill skill--bad">' + esc(x) + '</span>'));
  return chips.length ? '<div class="skills">' + chips.join("") + '</div>' : "";
}

function jumpTo(id){

  target.scrollIntoView({ behavior:"smooth", block:"center" });

  void target.offsetWidth;
  target.classList.add("card--flash");
}

function field(label, value, onInput, opts){
  opts = opts || {};
  const f = el("div","field");
  const lab = el("label");
  lab.textContent = label;
  let input;
  if(opts.type === "textarea"){ input = el("textarea"); input.rows = opts.rows || 3; }
  else if(opts.type === "select"){
    input = el("select");
    (opts.options || []).forEach(o => {
      const op = el("option");
      op.value = o.value; op.textContent = o.label;
      input.appendChild(op);
    });
  }
  else { input = el("input"); input.type = "text"; }
  input.value = value == null ? "" : value;
  if(opts.placeholder) input.placeholder = opts.placeholder;
  const id = "f-" + Math.abs(hashStr(label + Math.random()));
  input.id = id; lab.htmlFor = id;
  input.addEventListener(opts.type === "select" ? "change" : "input", () => onInput(input.value));
  f.append(lab, input);
  return f;
}
function hashStr(s){ let h = 0; for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i))|0; } return h; }

function toolBtn(label, title, cls, fn){
  const b = el("button","icon-btn" + (cls ? " " + cls : ""));
  b.type = "button"; b.textContent = label; b.title = title; b.setAttribute("aria-label", title);
  b.addEventListener("click", fn);
  return b;
}
function move(arr, i, dir){
  const j = i + dir;
  if(j < 0 || j >= arr.length) return;
  const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
}

function newId(){
  let max = 0;
  DRAFT.roster.forEach(m => {
    const n = parseInt(String(m.id).replace(/[^0-9]/g,""), 10);

  });
  return "m" + (max + 1);
}

/* 画像を縮小して data URI にする（ページに埋め込むため） */
function shrinkImage(file, max){
  max = max || 760;
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const cv = el("canvas");
      cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      try{ resolve(cv.toDataURL("image/jpeg", 0.82)); }
      catch(e){ reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode failed")); };
    img.src = url;
  });
}

  const ids = DRAFT.roster.map(m => m.id);
  DRAFT.lineup = DRAFT.lineup.filter(p => ids.indexOf(p.id) !== -1);
  DRAFT.notes = (DRAFT.notes || []).filter(n => (n.label || n.text || "").trim() !== "");
  DRAFT.updatedAt = todayLabel();
  DRAFT.savedAt = new Date().toISOString();

  DATA = clone(DRAFT);
  render();

  /* 端末に控えを残す（公開に失敗しても入力が消えないように） */
  try{ localStorage.setItem(LS_KEY, JSON.stringify({ base: embeddedStamp(), data: DATA })); }catch(e){}

  if(capArtifact){
    if(save){ save.classList.add("saving"); save.textContent = "保存中…"; }
    try{
      await capArtifact.publish(buildDocument(DATA));
      /* 成功すると全員のページが新しい版に切り替わります */
      closeEditor();
      toast("保存しました。全員に公開されます");
      return;
    }catch(e){
      const code = e && e.code;
      if(code === "conflict"){
        toast("ほかの人が先に保存しました。読み込み直します");
        setTimeout(() => location.reload(), 1600);
        return;
      }
      if(save){ save.classList.remove("saving"); save.textContent = "💾 保存して全員に公開"; }
      closeEditor();
      toast(code === "not_writer" || code === "not_granted"
        ? "このページを更新できる権限がありません。内容はこの端末にだけ保存しました"
        : "公開に失敗しました。内容はこの端末に保存しています");
      return;
    }
  }
  closeEditor();
  toast("保存しました（この端末のみ）。全員に反映するには HTMLをダウンロード");
}

async function downloadHtml(){
  const data = DRAFT ? DRAFT : DATA;
  const html = buildDocument(data);
  const filename = "index.html";
  if(capDownloads){
    try{ await capDownloads.save({ filename: filename, data: html }); toast("ファイルを保存しました"); }
    catch(e){ toast("保存はキャンセルされました"); }
    return;
  }
  try{
    const blob = new Blob([html], { type:"text/html" });
    const a = el("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast("index.html をダウンロードしました");
  }catch(e){
    toast("ダウンロードできませんでした");
  }
}

/* ===========================================================================
   その他
   =========================================================================== */
async function copyUrl(){
  const url = location.href;
  try{
    await navigator.clipboard.writeText(url);
    toast("URLをコピーしました");
  }catch(e){
    const ta = el("textarea");
    ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try{ ok = document.execCommand("copy"); }catch(e2){}
    ta.remove();
    toast(ok ? "URLをコピーしました" : "アドレスバーからコピーしてください");
  }
}

let toastTimer;
function toast(msg){
  let t = document.getElementById("toast");
  if(!t){
    t = el("div","toast");
    t.id = "toast";
    t.setAttribute("role","status");
    t.setAttribute("aria-live","polite");
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

document.addEventListener("keydown", (e) => {
  if(e.key === "Escape"){
    const box = document.getElementById("editor");
    if(box && !box.hidden) closeEditor();
  }
});

render();

/* Artifact として公開されている場合は「全員に公開」で保存できる */
if(window.claude && typeof window.claude.use === "function"){
  window.claude.use("artifact").then(ns => {
    capArtifact = ns || null;
    const box = document.getElementById("editor");
    if(capArtifact && box && !box.hidden) renderEditor();
  }).catch(() => {});
  window.claude.use("downloads").then(ns => { capDownloads = ns || null; }).catch(() => {});
}
