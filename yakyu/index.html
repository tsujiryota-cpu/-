<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サンデーズ オーダー表</title>
<meta name="description" content="草野球のオーダー(打順・守備位置)とメンバー紹介を写真つきで共有するページ。">
<meta property="og:title" content="⚾ サンデーズ オーダー表">
<meta property="og:description" content="打順・守備位置・メンバー紹介を写真つきで。集合時間と持ち物もここで確認。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=Saira+Condensed:wght@900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* ============================================================
   トークン: 色はすべてここで定義する(ライト = 昼のグラウンド)
   ============================================================ */
:root{
  --paper:#EFEDE3;
  --panel:#FBFAF4;
  --ink:#161B16;
  --ink-2:#4C5449;
  --ink-3:#7D8478;
  --rule:rgba(22,27,22,.14);
  --rule-strong:rgba(22,27,22,.26);
  --red:#BE3A2B;
  --turf:#2E5E3E;
  --dirt:#A97C50;
  --header-bg:#1E3D28;
  --header-ink:#F1EFE3;
  --header-ink-2:#A8C0A6;
  --chip:rgba(22,27,22,.06);
  --shadow:0 1px 0 rgba(22,27,22,.06), 0 8px 24px -18px rgba(22,27,22,.5);
  --flash:rgba(190,58,43,.16);
}
/* ダーク(OS設定) = ナイターの薄暮。data-theme="light" が明示された時は当てない */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F120E;
    --panel:#181D17;
    --ink:#EBE8DD;
    --ink-2:#A9B0A2;
    --ink-3:#7C8479;
    --rule:rgba(235,232,221,.16);
    --rule-strong:rgba(235,232,221,.3);
    --red:#FF6B54;
    --turf:#8CC07A;
    --dirt:#C79A6B;
    --header-bg:#14201A;
    --header-ink:#EBE8DD;
    --header-ink-2:#93A98F;
    --chip:rgba(235,232,221,.08);
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 30px -20px #000;
    --flash:rgba(255,107,84,.2);
  }
}
/* トグルで明示的にダークを選んだ場合 */
:root[data-theme="dark"]{
  --paper:#0F120E;
  --panel:#181D17;
  --ink:#EBE8DD;
  --ink-2:#A9B0A2;
  --ink-3:#7C8479;
  --rule:rgba(235,232,221,.16);
  --rule-strong:rgba(235,232,221,.3);
  --red:#FF6B54;
  --turf:#8CC07A;
  --dirt:#C79A6B;
  --header-bg:#14201A;
  --header-ink:#EBE8DD;
  --header-ink-2:#93A98F;
  --chip:rgba(235,232,221,.08);
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 30px -20px #000;
  --flash:rgba(255,107,84,.2);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  font-size:16px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.num{font-family:"Saira Condensed","Arial Narrow",Impact,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:4px}

/* ---------- ヘッダー: 対戦カード ---------- */
.hero{background:var(--header-bg);color:var(--header-ink);position:relative;overflow:hidden}
.hero__diamond{position:absolute;right:-40px;top:-20px;width:340px;height:340px;opacity:.16;pointer-events:none}
.hero__inner{position:relative;padding:34px 0 30px}
.eyebrow{
  font-size:.78rem;font-weight:700;letter-spacing:.18em;color:var(--header-ink-2);
  display:flex;flex-wrap:wrap;gap:.2em .9em;align-items:center;
}
.hero__team{
  font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;
  font-size:clamp(2.1rem,7vw,3.4rem);line-height:1.08;letter-spacing:-.01em;
  margin:.28em 0 .1em;text-wrap:balance;
}
.hero__vs{display:flex;align-items:baseline;gap:.55em;flex-wrap:wrap;font-size:clamp(1rem,3.4vw,1.25rem);font-weight:700}
.hero__vs span.vs{
  font-family:"Saira Condensed",sans-serif;font-weight:900;font-size:1.5em;
  color:var(--header-ink-2);letter-spacing:.02em;
}
.hero__ground{margin-top:.5em;color:var(--header-ink-2);font-size:.95rem;font-weight:500}
.hero__tools{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{
  font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;
  background:transparent;color:var(--header-ink);
  border:1.5px solid rgba(241,239,227,.38);border-radius:999px;
  padding:.45em 1.1em;display:inline-flex;align-items:center;gap:.45em;
  transition:background .18s ease,border-color .18s ease,transform .18s ease;
}
.btn:hover{background:rgba(241,239,227,.12);border-color:rgba(241,239,227,.7)}
.btn:active{transform:translateY(1px)}

/* ---------- 試合情報グリッド ---------- */
.facts{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  border-top:1px solid var(--rule);background:var(--panel);
}
.fact{padding:14px 18px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.fact:last-child{border-right:none}
.fact dt{font-size:.7rem;font-weight:700;letter-spacing:.14em;color:var(--ink-3)}
.fact dd{font-size:1.02rem;font-weight:700;margin-top:.15em}
.fact dd small{font-weight:500;color:var(--ink-2);font-size:.82rem}

/* ---------- セクション見出し ---------- */
section{margin-top:44px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.sec-head h2{font-size:1.3rem;font-weight:900;letter-spacing:.01em;line-height:1.3}
.sec-head p{font-size:.8rem;color:var(--ink-2);font-weight:500}

/* ---------- オーダー表 ---------- */
.order{
  margin-top:16px;background:var(--panel);border:1px solid var(--rule-strong);
  border-radius:6px;box-shadow:var(--shadow);overflow:hidden;
}
.order__row{
  display:grid;
  grid-template-columns:52px 40px minmax(0,1fr) auto;
  align-items:center;gap:12px;
  width:100%;text-align:left;background:transparent;border:0;
  font:inherit;color:inherit;cursor:pointer;
  padding:11px 14px;border-bottom:1px solid var(--rule);
  transition:background .16s ease;
}
.order__row:last-child{border-bottom:0}
.order__row:hover{background:var(--chip)}
.order__no{font-size:2rem;font-weight:900;color:var(--red);text-align:center;line-height:1}
.order__no small{display:block;font-size:.5em;color:var(--ink-3);letter-spacing:.1em;line-height:1}
.pos{
  width:40px;height:40px;border-radius:5px;display:grid;place-items:center;
  font-weight:900;font-size:1.05rem;color:#FBFAF4;background:var(--turf);
}
.pos[data-g="battery"]{background:var(--red)}
.pos[data-g="outfield"]{background:var(--dirt)}
.pos[data-g="dh"]{background:var(--ink-3)}
.order__name{font-weight:700;font-size:1.08rem;display:flex;align-items:baseline;gap:.5em;flex-wrap:wrap}
.order__name .badge{
  font-size:.66rem;font-weight:700;letter-spacing:.08em;color:var(--red);
  border:1px solid currentColor;border-radius:3px;padding:.05em .35em;
}
.order__note{font-size:.82rem;color:var(--ink-2);font-weight:500;line-height:1.5}
.order__meta{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:.8rem;font-weight:700;white-space:nowrap}
.order__meta .jersey{font-size:1.35rem;font-weight:900;color:var(--ink);line-height:1}
.bat{border:1px solid var(--rule-strong);border-radius:3px;padding:.1em .4em;font-size:.72rem}

/* 控え */
.bench{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.bench__item{
  display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--rule);border-radius:999px;padding:.35em .9em .35em .55em;
  font-size:.88rem;font-weight:700;cursor:pointer;color:inherit;font-family:inherit;
}
.bench__item:hover{border-color:var(--rule-strong)}
.bench__item .jersey{font-family:"Saira Condensed",sans-serif;font-weight:900;font-size:1.15rem;color:var(--red);font-variant-numeric:tabular-nums}
.bench__item small{font-weight:500;color:var(--ink-2)}

/* ---------- メンバー紹介 ---------- */
.members{display:grid;gap:14px;margin-top:18px;grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
@media (max-width:900px){.members{grid-template-columns:1fr}}
.card{
  position:relative;display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;
  background:var(--panel);border:1px solid var(--rule-strong);border-radius:8px;
  padding:14px;box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:20px;
}
.card__jersey{
  position:absolute;right:10px;top:2px;font-family:"Saira Condensed",sans-serif;font-weight:900;
  font-size:3.6rem;line-height:1;color:var(--ink);opacity:.09;font-variant-numeric:tabular-nums;pointer-events:none;
}
.photo{
  position:relative;aspect-ratio:4/5;border-radius:5px;overflow:hidden;
  background:var(--chip);border:1px solid var(--rule);
}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo__fallback{
  position:absolute;inset:0;display:grid;place-items:center;gap:2px;
  font-family:"Saira Condensed",sans-serif;font-weight:900;font-size:2rem;color:var(--ink-3);
  background:repeating-linear-gradient(135deg,var(--chip) 0 8px,transparent 8px 16px);
}
.photo__fallback span{font-family:"Zen Kaku Gothic New",sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.06em}
.card__body{min-width:0;padding-right:52px}
.card__kana{font-size:.7rem;letter-spacing:.1em;color:var(--ink-3);font-weight:700}
.card__name{font-size:1.22rem;font-weight:900;line-height:1.25;margin-top:-.1em}
.card__role{font-size:.8rem;font-weight:700;color:var(--turf);margin-top:.2em}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:.55em 0}
.tag{font-size:.72rem;font-weight:700;background:var(--chip);border-radius:3px;padding:.15em .5em;color:var(--ink-2)}
.card__intro{font-size:.9rem;color:var(--ink-2);line-height:1.72}
.card--flash{animation:flash 1.1s ease-out}
@keyframes flash{0%,40%{background:var(--flash)}100%{background:var(--panel)}}

/* ---------- 連絡事項 ---------- */
.notes{margin-top:16px;background:var(--panel);border:1px solid var(--rule-strong);border-radius:8px;padding:6px 18px}
.notes li{list-style:none;padding:11px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:baseline}
.notes li:last-child{border-bottom:0}
.notes b{font-size:.74rem;letter-spacing:.1em;color:var(--ink-3)}
.notes span{font-size:.94rem;font-weight:500}
@media (max-width:520px){.notes li{grid-template-columns:1fr;gap:2px}}

footer{margin:52px 0 40px;padding-top:18px;border-top:1px solid var(--rule);font-size:.8rem;color:var(--ink-3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- トースト ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);
  background:var(--ink);color:var(--paper);font-size:.85rem;font-weight:700;
  padding:.6em 1.2em;border-radius:999px;opacity:0;pointer-events:none;
  transition:opacity .22s ease,transform .22s ease;z-index:20;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 読み込み時のスタッガー */
.reveal{opacity:0;transform:translateY(8px);animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .reveal{animation:none;opacity:1;transform:none}
  .card--flash{animation:none}
  *{transition:none!important}
}

/* ---------- 印刷: オーダー表だけ1枚に ---------- */
@media print{
  body{background:#fff;color:#000}
  .hero{background:#fff;color:#000;border-bottom:2px solid #000}
  .hero__diamond,.hero__tools,.no-print,footer{display:none}
  .order,.card,.notes{box-shadow:none}
  .order__no{color:#000}
  .pos{background:#000!important;color:#fff}
}
</style>
</head>

      intro:"4回以降のリリーフ担当。角度のあるボールで右打者を詰まらせます。打席では意外とバットに当たります。" },
    { name:"岡田 蓮", kana:"OKADA REN", no:2, role:"内野手・代走 / 打右投右", photo:"photos/okada.jpg",
      tags:["代走","ユーティリティ","最年少"],
      intro:"内野ならどこでも守れる便利屋。終盤の代走で1点をもぎ取る役割。チーム最年少で元気だけは無限にあります。" },
    { name:"石川 悠", kana:"ISHIKAWA YU", no:25, role:"外野手・代打 / 打左投右", photo:"photos/ishikawa.jpg",
      tags:["代打","一発狙い","写真係"],
      intro:"ここで一本欲しい場面の代打。狙い球を絞って振り抜くスタイル。試合の写真はだいたいこの人が撮っています。" }
  ],
  notes: [
    { label:"集合", text:"8:30 グラウンド前の駐車場に集合。遅れる人はLINEグループへ" },
    { label:"持ち物", text:"グローブ / バット / スパイク / 白ユニ・紺帽 / 飲み物（多め）" },
    { label:"当番", text:"ベース設置=渡辺・小林 / 審判=辻 / 写真=石川 / ゴミ持ち帰り=全員" },
    { label:"会費", text:"1人1,000円（グラウンド代・ボール代）。井上が集めます" },
    { label:"試合後", text:"12:00ごろ解散 → 希望者で駅前の「大将」で打ち上げ" }
  ],
  updated: "2026.08.25"
};
/* ▲▲▲ 書き換えはここまで ▲▲▲ */

/* ---- 守備位置のグループ分け(色分けに使用) ---- */
const POS_GROUP = {
  "投":"battery","捕":"battery",
  "一":"infield","二":"infield","三":"infield","遊":"infield",
  "左":"outfield","中":"outfield","右":"outfield",
  "指":"dh"
};
const slug = (s) => "m-" + encodeURIComponent(s).replace(/%/g,"");
const el = (tag, cls) => { const n = document.createElement(tag); if(cls) n.className = cls; return n; };

/* ---- ヘッダー ---- */
const g = DATA.game;
document.getElementById("hero-eyebrow").textContent = [g.dateLabel, "PLAY BALL " + g.playball, DATA.tagline].filter(Boolean).join(" · ");
document.getElementById("hero-team").textContent = DATA.team;
document.getElementById("hero-vs").innerHTML = '<span class="vs">VS</span>' + escapeHtml(g.opponent);
document.getElementById("hero-ground").textContent = "📍 " + g.ground;
document.getElementById("footer-team").textContent = DATA.team + " / " + g.dateLabel;
document.getElementById("updated").textContent = DATA.updated;
document.title = DATA.team + " オーダー表";

/* ---- 試合情報 ---- */
const facts = [
  ["集合", g.gather, "プレイボール " + g.playball],
  ["対戦相手", g.opponent, ""],
  ["試合形式", g.format, ""],
  ["服装", g.uniform, g.weather]
];
const factsBox = document.getElementById("facts");
facts.forEach(([k,v,sub]) => {
  const d = el("div","fact");
  const dt = el("dt"); dt.textContent = k;
  const dd = el("dd"); dd.textContent = v;
  if(sub){ const s = el("small"); s.textContent = " " + sub; dd.appendChild(s); }
  d.append(dt,dd); factsBox.appendChild(d);
});

/* ---- オーダー表 ---- */
const orderBox = document.getElementById("order");
DATA.lineup.forEach((p, i) => {
  const row = el("button","order__row reveal");
  row.type = "button";
  row.style.animationDelay = (i * 45) + "ms";
  row.setAttribute("aria-label", (i+1) + "番 " + p.pos + " " + p.name + " の紹介を見る");

  const no = el("div","order__no num");
  no.innerHTML = (i+1) + "<small>番</small>";

  const pos = el("div","pos");
  pos.dataset.g = POS_GROUP[p.pos] || "infield";
  pos.textContent = p.pos;

  const main = el("div");
  const nm = el("div","order__name");
  nm.textContent = p.name;
  if(p.badge){ const b = el("span","badge"); b.textContent = p.badge; nm.appendChild(b); }
  const nt = el("div","order__note"); nt.textContent = p.note || "";
  main.append(nm, nt);

  const meta = el("div","order__meta");
  const jr = el("span","jersey num"); jr.textContent = p.no;
  const bt = el("span","bat"); bt.textContent = "打" + p.bat;
  meta.append(jr, bt);

  row.append(no, pos, main, meta);
  row.addEventListener("click", () => jumpTo(p.name));
  orderBox.appendChild(row);
});

/* ---- 控え ---- */
const benchBox = document.getElementById("bench");
DATA.bench.forEach(p => {
  const b = el("button","bench__item");
  b.type = "button";
  b.innerHTML = '<span class="jersey">' + p.no + '</span>' + escapeHtml(p.name) + ' <small>' + escapeHtml(p.role) + '</small>';
  b.addEventListener("click", () => jumpTo(p.name));
  benchBox.appendChild(b);
});

/* ---- メンバー紹介 ---- */
const membersBox = document.getElementById("members");
document.getElementById("member-count").textContent = "全" + DATA.members.length + "名";
DATA.members.forEach((m, i) => {
  const card = el("article","card reveal");
  card.id = slug(m.name);
  card.style.animationDelay = Math.min(i * 40, 400) + "ms";

  const jersey = el("div","card__jersey"); jersey.textContent = m.no;

  const photo = el("div","photo");
  const fallback = el("div","photo__fallback");
  fallback.innerHTML = "#" + m.no + "<span>PHOTO</span>";
  if(m.photo){
    const img = el("img");
    img.src = m.photo;
    img.alt = m.name;
    img.loading = "lazy";
    img.addEventListener("error", () => { img.remove(); photo.appendChild(fallback); });
    photo.appendChild(img);
  } else {
    photo.appendChild(fallback);
  }

  const body = el("div","card__body");
  const kana = el("p","card__kana"); kana.textContent = m.kana || "";
  const name = el("h3","card__name"); name.textContent = m.name;
  const role = el("p","card__role"); role.textContent = m.role || "";
  const tags = el("div","tags");
  (m.tags || []).forEach(t => { const s = el("span","tag"); s.textContent = t; tags.appendChild(s); });
  const intro = el("p","card__intro"); intro.textContent = m.intro || "";
  body.append(kana, name, role, tags, intro);

  card.append(jersey, photo, body);
  membersBox.appendChild(card);
});

/* ---- 連絡事項 ---- */
const notesBox = document.getElementById("notes");
DATA.notes.forEach(n => {
  const li = el("li");
  li.innerHTML = "<b>" + escapeHtml(n.label) + "</b><span>" + escapeHtml(n.text) + "</span>";
  notesBox.appendChild(li);
});

/* ---- 打順 → 紹介カードへジャンプ ---- */
function jumpTo(name){
  const target = document.getElementById(slug(name));
  if(!target){ showToast(name + " の紹介はまだ登録されていません"); return; }
  target.scrollIntoView({ behavior:"smooth", block:"center" });
  target.classList.remove("card--flash");
  void target.offsetWidth;
  target.classList.add("card--flash");
}

/* ---- URLコピー / 印刷 ---- */
document.getElementById("copy-btn").addEventListener("click", async () => {
  const url = location.href;
  try{
    await navigator.clipboard.writeText(url);
    showToast("URLをコピーしました");
  }catch(e){
    const ta = el("textarea");
    ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    showToast(ok ? "URLをコピーしました" : "コピーできませんでした。アドレスバーからコピーしてください");
  }
});
document.getElementById("print-btn").addEventListener("click", () => window.print());

let toastTimer;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
</script>
</body>
</html>
